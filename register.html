<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pet Service Registration | CSE370</title>
<style>
body{font-family:Arial;background:#ADD8E6}
.box{max-width:400px;margin:40px auto;background:#FFB6C1;padding:50px;border-radius:10px}
input,textarea,button{width:100%;padding:10px;margin:8px 0}
input,textarea,button{width:100%;padding:10px;margin:8px 0}
button{background:#2e86de;color:#fff;border:none;cursor:pointer}
button:hover{background:#1b4f72}
.hidden{display:none}
a{color:#2e86de;cursor:pointer}
</style>
</head>
<body>
<img src="cat.jpg" height="250" width="250" style="display: block; margin: 0 auto 10px auto; border-radius: 30%;">
<div class="box" id="register">
	<h3>PET CARE ZONE </h3>   
	<h3>Register</h3>
	<form action = "register.php" method ="POST">
	<input name="Name" placeholder="Name" required>
	<input name="Email" type="email" placeholder="Email" required>
	<input name="Password" type="password" placeholder="Password" required>
	<input name="Phone" placeholder="Phone" required>
	<input name="Address" placeholder="Address" required>
		
		<button type="submit">Register</button>
	</form>
<p>Already registered? <a onclick="toggle()">Login</a></p>
</div>

<div class="box hidden" id="login">
<h3>Login</h3>
<form action = "login.php" method ="POST">
	<input name="Email" type="Email" placeholder="Email" required>
	<input name="Password" type="Password" placeholder="Password" required>
	<button type="submit">Login</button>
</form>
<p>New user? <a onclick="toggle()">Register</a></p>
</div>

<script>
function toggle(){
  register.classList.toggle('hidden');
  login.classList.toggle('hidden');
}
function Reg_When_Done(){
  alert('Registration complete');
}
</script>
</body>
</html>
